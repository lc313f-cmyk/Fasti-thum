<style>

.font-popup-item { background: transparent; color: #fff; border: none; padding: 6px 10px; font-size: 12px; font-weight: 700; border-radius: 5px; cursor: pointer; text-align: left; white-space: nowrap; transition: background 0.12s; font-family: 'Noto Sans Bengali', sans-serif; line-height: 1.25; }
.font-popup-item:hover { background: #333; }
.font-popup-item.active { background: linear-gradient(135deg,#11998e,#38ef7d); color: #fff; }
.font-popup { position: absolute; display: none; background: #1e1e1e; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.7); padding: 4px; z-index: 540; border: 1px solid #333; flex-direction: column; gap: 1px; min-width: 140px; max-width: 170px; max-height: 230px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #555 #1e1e1e; }
.font-popup.show { display: flex; }
.font-popup::-webkit-scrollbar { width: 3px; }
.font-popup::-webkit-scrollbar-track { background: #1e1e1e; }
.font-popup::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }
.scroll-area { overflow-y:auto; overflow-x:hidden; background:#f4f6f9; padding-bottom:20px; -webkit-overflow-scrolling:touch; scrollbar-width:thin; scrollbar-color:#2a5298 #f0f0f0; }
.scroll-area::-webkit-scrollbar { width:8px; }
.scroll-area::-webkit-scrollbar-track { background:#f0f0f0; }

.thumbnail-gallery { width:100%; margin:0; padding:0 6px; box-sizing:border-box; }
.filter-tabs { display: flex; gap: 6px; padding: 10px 4px; flex-wrap: wrap; position: sticky; top: 0; z-index: 60; background: #f4f6f9; box-shadow: 0 4px 8px rgba(0,0,0,0.04); }
.filter-btn { background: #e2e8f0; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; color: #475569; transition: all 0.2s; white-space: nowrap; }

.icon-upload-btn { background: linear-gradient(135deg,#11998e,#38ef7d); color: #fff; padding: 7px 10px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; transition: box-shadow 0.3s ease; -webkit-tap-highlight-color: transparent; }

.thumb-name { font-size:11px; font-weight:600; color:#444; padding:2px 0; }

.bottom-options { width:100%; margin:16px auto 0; padding:0 6px; box-sizing:border-box; }
.options-row { background:#fff; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.08); display:flex; align-items:center; justify-content:space-between; padding:8px 10px; gap:8px; }
.option-card { display:flex; align-items:center; justify-content:center; gap:5px; padding:8px 10px; border-radius:8px; background:#f4f6f9; color:#333; font-size:10px; font-weight:700; cursor:pointer; border:none; flex:1; white-space:nowrap; transition:all 0.2s ease; }

#colorPickerModal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); z-index: 9999; justify-content: center; align-items: center; padding: 20px; }

.cp-box { width: 100%; max-width: 360px; background: #ffffff; border-radius: 16px; padding: 18px 18px 14px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); animation: cpPop 0.18s ease-out; }
@keyframes cpPop { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.cp-title { font-size: 16px; font-weight: 700; color: #222; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
.cp-title .cp-close { background: transparent; border: none; font-size: 18px; color: #888; cursor: pointer; padding: 4px; }
.cp-label { font-size: 12px; font-weight: 700; color: #444; margin-bottom: 6px; display: block; }
.cp-slider-wrap { margin-bottom: 14px; }

.cp-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 3px solid #2a5298; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }

#cpHue { background: linear-gradient(to right, #ff0000 0%, #ffff00 17%, #00ff00 33%, #00ffff 50%, #0000ff 67%, #ff00ff 83%, #ff0000 100%); }

.cp-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; gap: 10px; }

.cp-actions { display: flex; gap: 8px; }
.cp-btn { padding: 9px 16px; border: none; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s; letter-spacing: 0.5px; }
.cp-btn.cancel { background: #eef1f5; color: #555; }

.so-title i { color: #11998e; background: linear-gradient(135deg,#11998e,#38ef7d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-size: 20px; }

<body>
<div class="app-container">
<div class="editor-wrap">
<main class="editor">
<div class="canvas-wrap" id="canvasWrap">
<canvas id="canvas" width="1280" height="720" tabindex="0"></canvas>
<div class="floating-menu" id="floatingMenu">
<button class="edit-btn" id="menuEditBtn"><i class="fas fa-pen"></i> Edit</button>
<button class="font-btn" id="menuFontBtn"><i class="fas fa-font"></i> Font</button>
<button class="color-btn" id="menuColorBtn"><i class="fas fa-palette"></i> Color</button>
<button class="delete-btn" id="menuDeleteBtn"><i class="fas fa-trash"></i> Delete</button>
</div>
<div class="font-popup" id="fontPopup"></div>
<div class="color-popup" id="colorPopup"><div class="color-strip" id="colorStrip"></div></div>
<textarea id="hiddenInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" rows="1"></textarea>
</div>
<aside class="controls">
<button class="btn btn-success" id="downloadBtn" title="Save"><i class="fas fa-download"></i></button>
<div class="font-toolbar-wrap">
<button id="fontToolbarBtn" class="font-toolbar-btn" title="বাংলা ফন্ট">
<i class="fas fa-font"></i>
</button>
</div>
<button class="btn btn-share" id="shareBtn" title="Share"><i class="fas fa-share-alt"></i></button>
<button class="btn btn-undo" id="undoBtn" title="Undo" disabled><i class="fas fa-rotate-left"></i></button>
<label for="bulkThumbInput" class="icon-upload-btn" title="Add Photos"><i class="fas fa-images"></i></label>
<button class="btn btn-danger" id="resetBtn" title="Reset" style="display:flex; background:#f1f3f7; color:#d33;"><i class="fas fa-rotate-left"></i></button>
</aside>
</main>
</div>
<div class="scroll-area" id="scrollArea">
<section class="thumbnail-gallery">
<div class="filter-tabs">
<button class="filter-btn active" data-filter="all">All (<span id="countAll">0</span>)</button>
<button class="filter-btn" data-filter="image">Nature (<span id="countImage">0</span>)</button>
<button class="filter-btn" data-filter="color">Colors (<span id="countColor">0</span>)</button>

const undoBtn = document.getElementById('undoBtn');
const MAX_UNDO_STEPS = 30;
let undoStack = [];
let isRestoringUndo = false;

function captureSnapshot() {
return {
bgImage: bgImage ? bgImage.src : null, bgColor: bgColor,
bgGradient: bgGradient ? JSON.parse(JSON.stringify(bgGradient)) : null,
textColor: textColor, FB_NAME: FB_NAME, FB_NAME_VISIBLE: FB_NAME_VISIBLE,
FB_NAME_COLOR: FB_NAME_COLOR, fbNameOffsetX: fbNameOffsetX, fbNameOffsetY: fbNameOffsetY,
logoX: logoX, logoY: logoY, LOGO_SIZE: LOGO_SIZE, logoPlaceholderVisible: logoPlaceholderVisible,
logoImage: logoImage ? logoImage.src : null,
canvasWidth: canvas.width, canvasHeight: canvas.height,
globalFontKey: currentFontKey,
texts: JSON.parse(JSON.stringify(texts))
};
}
async function applySnapshot(snap) {
if (!snap) return;
isRestoringUndo = true;
try {
bgColor = snap.bgColor;
bgGradient = snap.bgGradient ? JSON.parse(JSON.stringify(snap.bgGradient)) : null;
textColor = snap.textColor; FB_NAME = snap.FB_NAME; FB_NAME_VISIBLE = snap.FB_NAME_VISIBLE;
FB_NAME_COLOR = snap.FB_NAME_COLOR; fbNameOffsetX = snap.fbNameOffsetX; fbNameOffsetY = snap.fbNameOffsetY;
logoX = snap.logoX; logoY = snap.logoY; LOGO_SIZE = snap.LOGO_SIZE; logoPlaceholderVisible = snap.logoPlaceholderVisible;
texts = JSON.parse(JSON.stringify(snap.texts));
texts.forEach(t => { if (!t.fontKey) t.fontKey = snap.globalFontKey || 'notoSansBn'; });
canvas.width = snap.canvasWidth; canvas.height = snap.canvasHeight;
if (snap.globalFontKey && FONT_STACKS[snap.globalFontKey]) {
currentFontKey = snap.globalFontKey;
}
if (snap.bgImage) {
await new Promise((resolve) => { const img = new Image(); img.crossOrigin = 'anonymous';
img.onload = () => { bgImage = img; resolve(); }; img.onerror = () => { bgImage = null; resolve(); }; img.src = snap.bgImage; });
} else bgImage = null;
if (snap.logoImage) {
await new Promise((resolve) => { const img = new Image();
img.onload = () => { logoImage = img; resolve(); }; img.onerror = () => { logoImage = null; resolve(); }; img.src = snap.logoImage; });
} else logoImage = null;
selectedIdx = null; editingIdx = null; editingFbName = false; draw(); saveSettings();
} finally { isRestoringUndo = false; }
}
let lastSnapshotTime = 0;
function pushUndo(force) {
if (isRestoringUndo) return;
const now = Date.now();
if (!force && now - lastSnapshotTime < 80) return;
lastSnapshotTime = now;
undoStack.push(captureSnapshot());
if (undoStack.length > MAX_UNDO_STEPS) undoStack.shift();
updateUndoBtn();
}
function updateUndoBtn() { undoBtn.disabled = undoStack.length === 0; }
async function doUndo() {
if (undoStack.length === 0) { return; }
const snap = undoStack.pop(); await applySnapshot(snap); updateUndoBtn();
}
undoBtn.addEventListener('click', doUndo);

const DB_NAME = 'FastiThumDB'; const DB_VERSION = 1; const STORE_PHOTOS = 'userPhotos';
let dbPromise = null;
function openDB() {
if (dbPromise) return dbPromise;
dbPromise = new Promise((resolve, reject) => {
if (!window.indexedDB) { reject(new Error('IndexedDB not supported')); return; }
const req = indexedDB.open(DB_NAME, DB_VERSION);
req.onupgradeneeded = (e) => { const db = e.target.result;
if (!db.objectStoreNames.contains(STORE_PHOTOS)) db.createObjectStore(STORE_PHOTOS, { keyPath: 'id', autoIncrement: true }); };
req.onsuccess = (e) => resolve(e.target.result); req.onerror = (e) => reject(e.target.error);
});
return dbPromise;
}
async function addPhotoToDB(photo) {
try { const db = await openDB();
return await new Promise((res, rej) => { const tx = db.transaction(STORE_PHOTOS, 'readwrite');
const req = tx.objectStore(STORE_PHOTOS).add({
imgDataUrl: photo.imgDataUrl, thumb: photo.thumb || null,
text: photo.text, sub: photo.sub
});
req.onsuccess = () => res(req.result); req.onerror = (e) => rej(e.target.error); });
} catch (e) { console.warn('addPhotoToDB failed', e); return null; }
}
async function deletePhotoFromDB(id) {
if (!id) return;
try { const db = await openDB();
await new Promise((res, rej) => { const tx = db.transaction(STORE_PHOTOS, 'readwrite');
const req = tx.objectStore(STORE_PHOTOS).delete(id);
req.onsuccess = () => res(); req.onerror = (e) => rej(e.target.error); });
} catch (e) { console.warn('deletePhotoFromDB failed', e); }
}
async function getAllPhotosFromDB() {
try { const db = await openDB();
return await new Promise((res, rej) => {
const tx = db.transaction(STORE_PHOTOS, 'readonly');
const req = tx.objectStore(STORE_PHOTOS).getAll();
req.onsuccess = () => res(req.result || []);
req.onerror = (e) => rej(e.target.error);
});
} catch (e) { console.warn('getAllPhotosFromDB failed', e); return []; }
}
async function clearUserPhotosDB() {
try { const db = await openDB();
await new Promise((res, rej) => { const tx = db.transaction(STORE_PHOTOS, 'readwrite');
tx.objectStore(STORE_PHOTOS).clear(); tx.oncomplete = () => res(); tx.onerror = (e) => rej(e.target.error); });
} catch (e) { console.warn('IndexedDB clear failed', e); }
}
function makeThumbnail(dataUrl, maxW, maxH, quality) {
return new Promise((resolve) => { const img = new Image();
img.onload = () => {
const ratio = Math.min(maxW / img.width, maxH / img.height, 1);
const w = Math.max(1, Math.round(img.width * ratio));
const h = Math.max(1, Math.round(img.height * ratio));
const c = document.createElement('canvas'); c.width = w; c.height = h;
const cctx = c.getContext('2d');
cctx.imageSmoothingEnabled = true;
cctx.imageSmoothingQuality = 'high';
cctx.drawImage(img, 0, 0, w, h);
try { resolve(c.toDataURL('image/jpeg', quality || 0.85)); } catch(e) { resolve(dataUrl); }
};
img.onerror = () => resolve(dataUrl); img.src = dataUrl; });
}
function resizeFullImage(dataUrl, maxDim, quality) {
return new Promise((resolve) => {
const img = new Image();
img.onload = () => {
const w0 = img.width, h0 = img.height;
let nw = w0, nh = h0;
if (w0 > maxDim || h0 > maxDim) {
if (w0 >= h0) { nw = maxDim; nh = Math.round((h0 * maxDim) / w0); }
else { nh = maxDim; nw = Math.round((w0 * maxDim) / h0); }
}
if (nw === w0 && nh === h0) { resolve(dataUrl); return; }
const c = document.createElement('canvas'); c.width = nw; c.height = nh;
const cctx = c.getContext('2d');
cctx.imageSmoothingEnabled = true;
cctx.imageSmoothingQuality = 'high';
cctx.drawImage(img, 0, 0, nw, nh);
try { resolve(c.toDataURL('image/jpeg', quality || 0.92)); } catch(e) { resolve(dataUrl); }
};
img.onerror = () => resolve(dataUrl);
img.src = dataUrl;
});
}
function ensureAndroidPermissions() {
return new Promise((resolve) => {
if (!window.cordova) { resolve(false); return; }
const perms = window.cordova.plugins && window.cordova.plugins.permissions;
if (!perms) { resolve(true); return; }
const list = [];
if (perms.WRITE_EXTERNAL_STORAGE) list.push(perms.WRITE_EXTERNAL_STORAGE);
if (perms.READ_EXTERNAL_STORAGE) list.push(perms.READ_EXTERNAL_STORAGE);
perms.requestPermissions(list, () => resolve(true), () => resolve(false));
});
}
function saveWithImageSaver(blob) {
return new Promise((resolve, reject) => {
if (!window.imageSaver || !window.imageSaver.saveBase64Image) {
reject(new Error('save-image-gallery plugin not available')); return;
}
const reader = new FileReader();
reader.onloadend = () => {
const base64Data = reader.result.split(',')[1];
const params = { data: base64Data, prefix: 'FastiThum_', format: 'JPG', quality: 100, mediaScanner: true };
window.imageSaver.saveBase64Image(params,
(filePath) => resolve({ where: 'gallery', path: filePath }),
(err) => reject(new Error('saveBase64Image failed: ' + err))
);
};
reader.onerror = () => reject(new Error('FileReader failed'));
reader.readAsDataURL(blob);
});
}
function scanMediaFile(filePath) {
return new Promise((resolve) => {
try {
const ms = window.MediaScanner
|| (window.cordova && window.cordova.plugins && window.cordova.plugins.MediaScanner)
|| window.mediascanner;
if (ms && typeof ms.scan === 'function') ms.scan(filePath, () => resolve(true), () => resolve(false));
else resolve(false);
} catch (e) { resolve(false); }
});
}
function saveWithCordovaFile(blob, fileName) {
return new Promise((resolve, reject) => {
if (!window.resolveLocalFileSystemURL || !window.cordova || !window.cordova.file) {
reject(new Error('Cordova File plugin not available')); return;
}
const candidates = [];
if (cordova.file.externalRootDirectory)
candidates.push({ root: cordova.file.externalRootDirectory, sub: ['Pictures', 'FastiThum'] });
if (cordova.file.externalDataDirectory)
candidates.push({ root: cordova.file.externalDataDirectory, sub: ['FastiThum'] });
if (cordova.file.dataDirectory)
candidates.push({ root: cordova.file.dataDirectory, sub: ['FastiThum'] });
if (!candidates.length) { reject(new Error('No writable directory')); return; }
let idx = 0;
const tryNext = () => {
if (idx >= candidates.length) { reject(new Error('All directories failed')); return; }
const { root, sub } = candidates[idx++];
window.resolveLocalFileSystemURL(root, (rootEntry) => {
const walk = (parent, i) => {
if (i >= sub.length) { writeFile(parent); return; }
parent.getDirectory(sub[i], { create: true }, (d) => walk(d, i + 1), () => tryNext());
};
const writeFile = (dir) => {
dir.getFile(fileName, { create: true }, (fileEntry) => {
fileEntry.createWriter((writer) => {
writer.onwriteend = async () => {
const path = fileEntry.toURL();
await scanMediaFile(path);
resolve({ where: 'gallery', path });
};
writer.onerror = () => tryNext();
writer.write(blob);
}, () => tryNext());
}, () => tryNext());
};
walk(rootEntry, 0);
}, () => tryNext());
};
tryNext();
});
}
async function saveImage(blob, fileName) {
await ensureAndroidPermissions();
try { const r = await saveWithImageSaver(blob); return { ok: true, where: r.where }; } catch (e) { console.warn('imageSaver failed:', e.message); }
try { const r = await saveWithCordovaFile(blob, fileName); return { ok: true, where: r.where }; } catch (e) { console.warn('Cordova File failed:', e.message); }
try {
const url = URL.createObjectURL(blob);
const link = document.createElement('a');
link.download = fileName; link.href = url;
document.body.appendChild(link); link.click();
setTimeout(() => { document.body.removeChild(link); URL.revokeObjectURL(url); }, 1500);
return { ok: true, where: 'browser' };
} catch (e) { return { ok: false, err: e.message }; }
}

let featGradCount = 0;
GRADIENT_PRESETS.forEach(preset => {
if (featuredGradSet.has(preset.name)) {
featGradCount++;
frag.appendChild(createGradientCard(featGradCount, preset));
}
});
const usedPhotos = new Set();
let imageCardCount = 0;
for (let i = 0; i < sampleIds.length; i++) {
const photoKey = sampleIds[i].trim();
if (usedPhotos.has(photoKey)) continue;
usedPhotos.add(photoKey); imageCardCount++;
frag.appendChild(createImageCard(imageCardCount, sampleIds[i]));
}
const usedColors = new Set(featuredColorKeys);
let colorCardCount = 0;
shuffledColors.forEach(color => {
const colorKey = color.toLowerCase().trim();
if (usedColors.has(colorKey)) return;
usedColors.add(colorKey); colorCardCount++;
frag.appendChild(createColorCard(colorCardCount, color));
});
let gradientCount = 0;
shuffledGradients.forEach(preset => {
if (featuredGradSet.has(preset.name)) return;
gradientCount++;
frag.appendChild(createGradientCard(gradientCount, preset));
});
grid.appendChild(frag);
}
function updateFilterCounts() {
const allCards = document.querySelectorAll('.thumb-card');
const customCards = document.querySelectorAll('.thumb-card[data-custom="true"]');
const imageCards = document.querySelectorAll('.thumb-card[data-type="image"]:not([data-custom="true"])');
const colorCards = document.querySelectorAll('.thumb-card[data-type="color"]');
document.getElementById('countAll').textContent = allCards.length;
document.getElementById('countCustom').textContent = customCards.length;
document.getElementById('countImage').textContent = imageCards.length;
document.getElementById('countColor').textContent = colorCards.length;
}
function renumberVisibleCards() {
const allCards = document.querySelectorAll('.thumb-card');
let counter = 0;
allCards.forEach(card => {
if (card.style.display !== 'none') {
counter++;
const numSpan = card.querySelector('.thumb-number');
if (numSpan) numSpan.textContent = counter;
const nameNum = card.querySelector('.thumb-name-number');
if (nameNum) nameNum.textContent = counter;
}
});
}
document.querySelectorAll('.filter-btn').forEach(btn => {
btn.addEventListener('click', () => {
document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
btn.classList.add('active');
const filter = btn.getAttribute('data-filter');
document.querySelectorAll('.thumb-card').forEach(card => {
const isCustom = card.getAttribute('data-custom') === 'true';
const cardType = card.getAttribute('data-type');
let show = false;
if (filter === 'all') show = true;
else if (filter === 'custom') show = isCustom;
else if (filter === 'image') show = (cardType === 'image' && !isCustom);
else if (filter === 'color') show = (cardType === 'color');
card.style.display = show ? 'block' : 'none';
});
renumberVisibleCards();
});
});
const galleryGrid = document.getElementById('galleryGrid');
function loadBgImage(url, fallbackColor, fallbackUrl) {
const tryList = [url];
if (fallbackUrl) tryList.push(fallbackUrl);
tryList.push('https://picsum.photos/seed/' + Date.now() + '/1920/1080');
let i = 0;
const tryNext = () => {
if (i >= tryList.length) {
bgImage = null;
bgColor = fallbackColor || '#1e3c72';
scheduleDraw();
showToast('ছবি লোড হয়নি --- ইন্টারনেট চেক করুন', 'error');
return;
}
const img = new Image();
img.crossOrigin = 'anonymous';
img.onload = () => { bgImage = img; bgGradient = null; scheduleDraw(); };
img.onerror = () => { i++; tryNext(); };
img.src = tryList[i];
};
tryNext();
}
galleryGrid.addEventListener('click', async (e) => {
const deleteBtn = e.target.closest('.card-delete-btn');
if (deleteBtn) {
e.preventDefault(); e.stopPropagation();
const card = deleteBtn.closest('.thumb-card');
if (!card) return;
const dbId = card.getAttribute('data-db-id');
const idx = Array.from(document.querySelectorAll('.thumb-card[data-custom="true"]')).indexOf(card);
if (idx >= 0) userCards.splice(idx, 1);
else {
const uidx = userCards.findIndex(u => String(u.id) === String(dbId));
if (uidx >= 0) userCards.splice(uidx, 1);
}
if (dbId) await deletePhotoFromDB(Number(dbId));
card.remove(); saveUserCards(); updateFilterCounts(); renumberVisibleCards();
showToast('🗑️ ছবি মুছে ফেলা হয়েছে', 'success', 1500);
return;
}
const card = e.target.closest('.thumb-card');
if (!card) return;
pushUndo(true);
const colorAttr = card.getAttribute('data-color');
const gradientAttr = card.getAttribute('data-gradient');
const imgSrc = card.getAttribute('data-img');
const fallbackImg = card.getAttribute('data-fallback-img') || '';
if (gradientAttr) {
try {
const preset = JSON.parse(gradientAttr);
bgImage = null;
bgGradient = { colors: preset.colors.slice(), angle: (typeof preset.angle === 'number') ? preset.angle : 135 };
scheduleDraw(); return;
} catch(err) { console.warn('Gradient parse failed', err); }
}
if (colorAttr) { bgImage = null; bgGradient = null; bgColor = colorAttr; scheduleDraw(); return; }
if (imgSrc) loadBgImage(imgSrc, '#1e3c72', fallbackImg);
scheduleDraw();
});
document.getElementById('bulkThumbInput').addEventListener('change', async (e) => {
const files = e.target.files;
if (!files || !files.length) return;
let processed = 0;
showToast(`⏳ ${files.length} টি ছবি প্রসেস হচ্ছে...`, 'info', 1500);
for (const file of Array.from(files)) {
try {
const fullDataUrl = await new Promise((resolve, reject) => {
const reader = new FileReader();
reader.onload = (ev) => resolve(ev.target.result);
reader.onerror = reject; reader.readAsDataURL(file);
});
const resizedFull = await resizeFullImage(fullDataUrl, 1920, 0.92);
const thumbDataUrl = await makeThumbnail(resizedFull, 800, 450, 0.85);
const customNum = userCards.length + 1;
const cardData = { imgDataUrl: resizedFull, thumb: thumbDataUrl, text: 'CUSTOM IMAGE ' + customNum, sub: 'User Uploaded' };
const dbId = await addPhotoToDB(cardData);
const savedCard = { id: dbId, imgDataUrl: resizedFull, thumb: thumbDataUrl, text: cardData.text, sub: cardData.sub };
userCards.push(savedCard);
const card = createUserCard(customNum, thumbDataUrl, resizedFull, cardData.text, cardData.sub, dbId);
galleryGrid.prepend(card); updateFilterCounts(); renumberVisibleCards();
processed++;
} catch (err) { console.warn('Photo add failed', err); }
}
e.target.value = '';
saveUserCards();
if (processed > 0) showToast('✅ ' + processed + ' টি ছবি সেভ হয়েছে', 'success');
else showToast('❌ ছবি যোগ করা যায়নি', 'error');
});
document.getElementById('logoUpload').addEventListener('change', (e) => {
const file = e.target.files[0]; if (!file) return;
const reader = new FileReader();
reader.onload = (ev) => {
const img = new Image();
img.onload = () => {
pushUndo(true); logoImage = img; logoPlaceholderVisible = true; scheduleDraw();
document.querySelectorAll('.thumb-card').forEach(card => {
card.classList.add('has-logo');
const badge = card.querySelector('.card-logo-badge');
if (badge) badge.style.backgroundImage = `url('${ev.target.result}')`;
});
};
img.src = ev.target.result;
};
reader.readAsDataURL(file); e.target.value = '';
});
const saveOptionsModal = document.getElementById('saveOptionsModal');
const soCloseBtn = document.getElementById('soCloseBtn');
const soSaveNowBtn = document.getElementById('soSaveNowBtn');
const soQualityWrap = document.getElementById('soQualityWrap');
const soQualitySlider = document.getElementById('soQualitySlider');
const soQualityValue = document.getElementById('soQualityValue');
const downloadBtn = document.getElementById('downloadBtn');
const shareBtn = document.getElementById('shareBtn');
let selectedFormat = 'png'; let selectedQuality = 0.92;
let lastSavedBlob = null; let lastSavedFileName = '';
function updateQualitySliderTrack() {
const pct = parseFloat(soQualitySlider.value);
soQualitySlider.style.background = `linear-gradient(to right, #38ef7d 0%, #38ef7d ${pct}%, #e2e8f0 ${pct}%, #e2e8f0 100%)`;
}
document.querySelectorAll('.so-option').forEach(opt => {
opt.addEventListener('click', () => {
document.querySelectorAll('.so-option').forEach(o => o.classList.remove('active'));
opt.classList.add('active');
selectedFormat = opt.getAttribute('data-format');
if (selectedFormat === 'png') soQualityWrap.classList.add('hidden');
else soQualityWrap.classList.remove('hidden');
});
});
soQualitySlider.addEventListener('input', () => {
const v = parseInt(soQualitySlider.value, 10);
soQualityValue.textContent = v + '%'; selectedQuality = v / 100; updateQualitySliderTrack();
});
updateQualitySliderTrack();
function openSaveOptions() { saveOptionsModal.classList.add('open'); }
function closeSaveOptions() { saveOptionsModal.classList.remove('open'); }
soCloseBtn.addEventListener('click', closeSaveOptions);
saveOptionsModal.addEventListener('click', (e) => { if (e.target === saveOptionsModal) closeSaveOptions(); });
downloadBtn.addEventListener('click', () => openSaveOptions());
function getMimeType(fmt) { if (fmt === 'jpeg') return 'image/jpeg'; if (fmt === 'webp') return 'image/webp'; return 'image/png'; }
function getExt(fmt) { if (fmt === 'jpeg') return 'jpg'; if (fmt === 'webp') return 'webp'; return 'png'; }
soSaveNowBtn.addEventListener('click', () => {
soSaveNowBtn.disabled = true;
soSaveNowBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
if (editingIdx !== null || editingFbName) stopTyping();
hideFloatingMenu(); hideColorPopup(); hideFontPopup();
closeToolbarFontPopup();
const prevSelected = selectedIdx;
selectedIdx = null; isRotating = false; pressedLogo = false; draw();
setTimeout(async () => {
const mime = getMimeType(selectedFormat);
const quality = selectedFormat === 'png' ? undefined : selectedQuality;
canvas.toBlob(async (blob) => {
selectedIdx = prevSelected; scheduleDraw();
soSaveNowBtn.disabled = false;
soSaveNowBtn.innerHTML = '<i class="fas fa-download"></i> Save Now';
if (!blob) { showToast('❌ সেভ করা যায়নি! আবার চেষ্টা করুন', 'error', 3500); return; }
lastSavedBlob = blob;
lastSavedFileName = 'FastiThum_' + Date.now() + '.' + getExt(selectedFormat);
const result = await saveImage(blob, lastSavedFileName);
closeSaveOptions();
if (result.ok) showToast('✅ সেভ হয়েছে', 'success', 2200);
else showToast('❌ সেভ ব্যর্থ: ' + (result.err || 'Unknown'), 'error', 3500);
}, mime, quality);
}, 100);
});
shareBtn.addEventListener('click', async () => {
if (editingIdx !== null || editingFbName) stopTyping();
hideFloatingMenu(); hideColorPopup(); hideFontPopup();
closeToolbarFontPopup();
const prevSelected = selectedIdx;
selectedIdx = null; isRotating = false; pressedLogo = false; draw();
await new Promise(resolve => {
setTimeout(() => {
canvas.toBlob((blob) => {
selectedIdx = prevSelected; scheduleDraw();
if (blob) { lastSavedBlob = blob; lastSavedFileName = 'FastiThum_' + Date.now() + '.png'; }
resolve();
}, 'image/png');
}, 100);
});
if (!lastSavedBlob) { showToast('❌ শেয়ার করা যায়নি', 'error', 2000); return; }
const fileName = lastSavedFileName; const blob = lastSavedBlob;
async function tryWebShare() {
try {
const file = new File([blob], fileName, { type: 'image/png' });
if (navigator.canShare && navigator.canShare({ files: [file] })) {
await navigator.share({ files: [file], title: 'My Thumbnail', text: 'আমার থাম্বনেইল' });
showToast('✅ শেয়ার সম্পন্ন', 'success', 1500); return true;
}
} catch (err) { if (err && err.name === 'AbortError') return true; }
try {
if (navigator.share) { await navigator.share({ title: 'My Thumbnail', text: 'আমার থাম্বনেইল' }); showToast('✅ শেয়ার সম্পন্ন', 'success', 1500); return true; }
} catch (err) { if (err && err.name === 'AbortError') return true; }
return false;
}
function tryCordovaShare() {
return new Promise((resolve) => {
if (!window.plugins || !window.plugins.socialsharing) { resolve(false); return; }
const reader = new FileReader();
reader.onloadend = () => {
const base64Data = reader.result;
if (window.plugins.socialsharing.shareWithOptions) {
try {
window.plugins.socialsharing.shareWithOptions(
{ message: '', subject: 'Thumbnail', files: [base64Data], chooserTitle: 'শেয়ার করুন' },
() => { showToast('✅ শেয়ার সম্পন্ন', 'success', 1500); resolve(true); },
(err) => { console.warn('shareWithOptions failed', err); tryClassicShare(base64Data).then(resolve); }
);
} catch (e) { tryClassicShare(base64Data).then(resolve); }
} else tryClassicShare(base64Data).then(resolve);
};
reader.onerror = () => resolve(false);
reader.readAsDataURL(blob);
});
}
function tryClassicShare(base64Data) {
return new Promise((resolve) => {
try {
window.plugins.socialsharing.share('', 'Thumbnail', base64Data, null,
() => { showToast('✅ শেয়ার সম্পন্ন', 'success', 1500); resolve(true); },
(err) => { console.warn('Classic share failed', err); resolve(false); }
);
} catch (e) { resolve(false); }
});
}
function fallbackDownload() {
try {
const url = URL.createObjectURL(blob);
const link = document.createElement('a');
link.download = fileName; link.href = url;
document.body.appendChild(link); link.click();
setTimeout(() => { document.body.removeChild(link); URL.revokeObjectURL(url); }, 1500);
showToast('✅ ডাউনলোড হয়েছে --- এখন শেয়ার করুন', 'success', 2500);
} catch (e) { showToast('❌ শেয়ার সাপোর্ট নেই', 'error', 2000); }
}
if (window.plugins && window.plugins.socialsharing) {
const cordovaOk = await tryCordovaShare(); if (cordovaOk) return;
}
const webOk = await tryWebShare(); if (webOk) return;
fallbackDownload();
});
document.getElementById('resetBtn').addEventListener('click', async () => {
Object.keys(localStorage).forEach(k => { if (k.startsWith('fastiThum') || k.startsWith('thumbMaker')) localStorage.removeItem(k); });
await clearUserPhotosDB();
undoStack = []; updateUndoBtn();
bgImage = null; logoImage = null; logoPlaceholderVisible = true;
logoX = 10; logoY = 10; LOGO_SIZE = DEFAULT_LOGO_SIZE;
bgColor = '#1e3c72'; textColor = '#ffffff'; bgGradient = null;
FB_NAME = '하산'; FB_NAME_VISIBLE = true; FB_NAME_COLOR = '#1877f2';
fbNameOffsetX = 0; fbNameOffsetY = 0;
texts = [];
userCards = [];
selectedIdx = null; editingIdx = null; editingFbName = false;
dragging = null; draggingLogo = false; draggingFbName = false;
pressedTextIdx = null; pressedFbName = false; pressedLogo = false;
longPressTriggered = false; isRotating = false; rotatingIdx = null;
menuTargetIsFbName = false;
currentFontKey = 'notoSansBn';
cancelPressTimer(); hideFloatingMenu(); hideColorPopup(); hideFontPopup(); closeSaveOptions();
closeToolbarFontPopup();
canvas.width = 1280; canvas.height = 720;
lastSavedBlob = null; lastSavedFileName = '';
loadAllThumbnails(); updateFilterCounts(); renumberVisibleCards(); scheduleDraw();
});
document.querySelectorAll('.bottom-options .option-card').forEach(card => {
card.addEventListener('click', () => {
pushUndo(true);
const sizeType = card.getAttribute('data-size');
if (sizeType === 'facebook-cover') { canvas.width = 1200; canvas.height = 630; }
else if (sizeType === 'youtube-thumb') { canvas.width = 1280; canvas.height = 720; }
else if (sizeType === 'square-logo') { canvas.width = 1000; canvas.height = 1000; }
else if (sizeType === 'insta-post') { canvas.width = 1080; canvas.height = 1080; }
texts.forEach((t, i) => clampTextPosition(i));
clampFbNamePosition(); scheduleDraw();
});
});
buildColorStrip();
loadFromLocalStorage();
hydrateUserPhotosFromDB().then(() => {
loadAllThumbnails();
updateFilterCounts();
renumberVisibleCards();
});
clampFbNamePosition();
scheduleDraw();
updateUndoBtn();
document.addEventListener('deviceready', function() { console.log('✅ Cordova ready'); ensureAndroidPermissions(); }, false);
window.addEventListener('beforeunload', () => { saveSettings(); saveUserCards(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { saveSettings(); saveUserCards(); } });
window.addEventListener('pagehide', () => { saveSettings(); saveUserCards(); });
</script>
